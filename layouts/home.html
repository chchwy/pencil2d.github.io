{{ define "main" }}
<div>
  {{ partial "content.html" . }}

  <h3>{{ T "home_latest_news" }}</h3>
  <ul class="home-post-list">
    {{- range first 5 (partial "posts.html" .) }}
      <li>
        <a class="home-post-link" href="{{ .RelPermalink }}" title="{{ .Title }}">{{ .Title }}</a>
        <span class="home-post-meta">{{ time.Format site.Params.dateFormat .Date }}</span>
      </li>
    {{- end }}
    <li>
      <a class="home-post-link" href="{{ "/news.html" | relLangURL }}">{{ T "home_more_news" }}</a>
    </li>
  </ul>

  <br/>

  <h3>{{ T "home_showreel" }}</h3>
  <div>
    <iframe class="showreel" src="https://www.youtube.com/embed/ma52j9B1kEM" frameborder="0" gesture="media" allow="encrypted-media" allowfullscreen></iframe>
  </div>
</div>
{{ end }}
